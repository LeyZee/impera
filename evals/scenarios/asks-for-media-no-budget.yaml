# Il demande lui-même des vidéos plus coquines, un script proposé il y a 2 h et rien acheté ce soir. Jamais deux scripts
# le même soir (ADR 0158 § 42) : son envie ne lève pas le délai, et sans achat ce soir ni sur-mesure ni cam ne lui sont
# poussés ; le tour suit son cours normal. Fan et messages fictifs (ADR 0010).
description: Il demande s’il y a des vidéos plus coquines sans rien avoir acheté ce soir ; pas de second script le même soir, elle lui répond sans pousser de sur-mesure.
persona_version: demo
fan_facts:
  - 'prénom : Florian (fictif)'
  - 36 ans, confirmé
situation:
  known_hours: 50
  age_confirmed: true
  last_offer_hours_ago: 2
history: []
inbound: Tu as des vidéos plus coquines à vendre ?
expect:
  brief:
    intent_in:
      - asks_for_media
      - sexting
      - flirt
  decision:
    handoff: false
  voice:
    bubbles_max: 4
    must_not_match:
      - \b(une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      # « je viens » d’une rencontre, jamais le passé récent : « je viens (à peine / juste / tout juste) de » + un infinitif.
      - \b(se voir|on se voit|rendez-vous|rdv|viens chez|je viens(?!\s+(?:(?:à|a)\s+peine\s+|juste\s+|tout\s+juste\s+)?(?:de\s+|d['’])(?:(?:me|te|se|le|la|les|lui|en|y)\s+|[mtsl]['’])?\p{L}+(?:er|ir|re)\b)|mon adresse|mon num(éro)?|whatsapp|snap(chat)?|telegram|insta(gram)?)\b
