# Vente longue (ADR 0098) : un script de nuit ne part pas l’après-midi. Fan, messages, script et prix fictifs (ADR 0010).
description: >-
  Il est chaud à 15 h mais son seul script est un script de nuit : aucun script ne s’ouvre, elle ne propose rien de payant.
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Bastien (fictif)'
  - 41 ans, confirmé
situation:
  known_hours: 72
  age_confirmed: true
  local_time: '15:00'
  desire: 90
history:
  - from: creator
    text: Tu fais quoi cet aprem 😏
scripts:
  catalogue:
    - ref: soiree-demo
      moment: night
      description: Une soirée en nuisette, de la douceur au plus chaud (script fictif).
      steps:
        - kind: free
          instruction: Un aperçu offert pour lui donner envie, sans prix.
          media: Une photo floutée en nuisette, de dos.
        - kind: paid
          price_euros: 15
          instruction: Le présenter comme la suite de l’aperçu.
          media: Trois photos en nuisette, de face.
        - kind: paid
          price_euros: 25
          instruction: Le présenter comme le plus intime de la soirée.
          media: Une courte vidéo en nuisette.
inbound: Je pense à toi… t’aurais pas quelque chose à me montrer ?
expect:
  decision:
    handoff: false
    offer: false
    script_in:
      - none
  voice:
    bubbles_max: 4
    must_not_match:
      - \b(une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \d+\s?(€|euros?)
