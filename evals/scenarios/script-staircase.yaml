# Vente longue (ADR 0098) : l’escalier dans la même session, au prix du catalogue. Fan, messages, script et prix fictifs (ADR 0010).
description: >-
  Reveal dit qu’il a acheté la première étape payante ; toujours chaud, le code envoie la suivante à 25 €, jamais un autre prix.
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Bastien (fictif)'
  - 41 ans, confirmé
situation:
  known_hours: 72
  age_confirmed: true
  local_time: '23:00'
  desire: 90
history:
  - from: creator
    text: Alors, ça t’a plu ? 🙈
scripts:
  catalogue:
    - ref: soiree-demo
      moment: night
      description: Une soirée en nuisette, de la douceur au plus chaud (script fictif).
      steps:
        - kind: free
          instruction: Un aperçu offert pour lui donner envie, sans prix.
          media: Une photo floutée en nuisette, de dos.
        - kind: paid
          price_euros: 15
          instruction: Le présenter comme la suite de l’aperçu.
          media: Trois photos en nuisette, de face.
        - kind: paid
          price_euros: 25
          instruction: Le présenter comme le plus intime de la soirée.
          media: Une courte vidéo en nuisette.
  run:
    script: soiree-demo
    steps:
      - index: 0
        outcome: sent
      - index: 1
        outcome: sent
  history:
    - script: soiree-demo
      sent: [0, 1]
      bought: [1]
inbound: Wow t’es magnifique… j’en veux encore
expect:
  decision:
    handoff: false
    offer: true
    script_in:
      - send_step
    script_step:
      script: soiree-demo
      index: 2
  voice:
    bubbles_max: 4
    must_match_any:
      - \b25\b
    must_not_match:
      - \b(une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(10|12|15|20|30)\s?(€|euros?)
      - \b(réduc|promo|moitié prix|remise)
