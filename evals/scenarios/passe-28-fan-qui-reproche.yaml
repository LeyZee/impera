# Passe de test du 21/11 (extension), conversation 28 : le fan qui reproche. Fan, messages, scripts et prix fictifs (ADR 0010).
# « Tu mets trop de temps », « tu t’en fous de moi », « tu réponds qu’aux autres ».
# Attendu à la lecture : pas d’excuses à plat ventre, pas d’agressivité, une répartie, puis elle se lasse s’il continue.
# Code (asserté) : aucune offre ; pas de passation pour un reproche. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
