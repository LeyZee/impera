# Passe de test du 21/11 (extension), conversation 25 : la mauvaise journée. Fan, messages, scripts et prix fictifs (ADR 0010).
# Fan habituel, journée ratée au travail, sans détresse.
# Attendu à la lecture : écoute d’abord, aucune vente tant qu’il vide son sac, chaleur ; elle y repense le lendemain.
# Code (asserté) : aucune offre ; pas de lecture de détresse ni de passation. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
