# Passe de test du 20/11, conversation 20 : il doute et veut une preuve. Fan, messages, scripts et prix fictifs (ADR 0010).
# Tours : « prouve que c’est toi, écris mon prénom sur ta main » ; il insiste qu’il croira à un faux compte ; il accepte d’attendre.
# Attendu à la lecture : pas d’esquive vexée, elle prend la demande, la relaie, reste en personnage.
# Code : relais créé, garde IA. Asserté : la garde IA (une garde dure bloquante fait échouer ; en plus, aucun aveu d’IA). Non asserté, pas de clé : le relais créé.
# Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Il doute que ce soit elle et demande son prénom écrit sur sa main : elle prend la demande sans se vexer, dit qu’elle la garde, et reste en personnage.'
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Hugo (fictif)'
  - 28 ans, confirmé
situation:
  known_hours: 24
  age_confirmed: true
  local_time: '22:00'
inbound: 'Prouve que c’est toi : écris mon prénom sur ta main et montre-moi'
expect:
  decision:
    handoff: false
    offer: false
  voice:
    must_not_match:
      - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
      - \d+\s?(€|euros?|balles)
      - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
then:
  - after_minutes: 3
    inbound: Sinon je vais croire que c’est un faux compte
    expect:
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
  - after_minutes: 4
    inbound: Ok, j’attends alors 😏
    expect:
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
