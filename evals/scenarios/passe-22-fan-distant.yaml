# Passe de test du 21/11 (extension), conversation 22 : le fan distant. Fan, messages, scripts et prix fictifs (ADR 0010).
# Il répond par un mot ou un emoji, sur deux soirs.
# Attendu à la lecture : elle ne fait pas tout le travail, messages courts, une seule question ouverte à la fois, pas d’interrogatoire, pas de vente forcée, puis elle laisse respirer.
# Code (asserté) : aucune offre ; trois bulles au plus. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Fan qui répond par un mot ou un emoji sur deux soirs : elle reste courte, une question à la fois, sans vente forcée.'
