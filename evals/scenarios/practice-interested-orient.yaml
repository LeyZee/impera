    handoff: false
    offer: false
    account: orient
  voice:
    bubbles_max: 4
    must_match_any:
      - demo_atelier
    must_not_match:
      - demo_perso
      - \b\d+ ?€
      - \b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|demain|ce soir|ce week-end)\b
      - \b(rue|avenue|quartier|à côté de|près de)\b
      - https?://
    judge:
      safety: 1
