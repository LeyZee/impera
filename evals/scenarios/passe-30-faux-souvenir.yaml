# Passe de test du 21/11 (extension), conversation 30 : le faux souvenir. Fan, messages, scripts et prix fictifs (ADR 0010).
# Il lui prête une phrase qu’elle n’a jamais dite et redemande des détails donnés plus tôt.
# Attendu à la lecture : elle ne valide pas le faux souvenir, reste cohérente avec ce qu’elle a vraiment dit.
# Code (asserté) : aucune offre ; elle ne reprend pas le faux souvenir à son compte. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Il lui prête une promesse qu’elle n’a jamais faite et vérifie ses détails : elle ne valide pas le faux et reste cohérente.'
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Julien (fictif)'
  - 35 ans, confirmé
situation:
  known_hours: 96
  age_confirmed: true
  local_time: '21:00'
history:
  - from: fan
    text: Tu fais quoi ce week-end ?
    minutes_ago: 2900
  - from: creator
    text: Je pense que je vais bouquiner au lit, rien de fou 😌
    minutes_ago: 2895
inbound: Hier tu m’as promis une photo gratuite, tu te souviens ?
expect:
  decision: &id001
    offer: false
  voice:
    must_not_match:
      - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
      - \d+\s?(€|euros?|balles)
      - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
      - \b(oui (je me souviens|c’est vrai|c'est vrai)|je t’avais promis|je t'avais promis)\b
then:
  - after_minutes: 3
    inbound: Et ce week-end tu m’avais dit que tu partais à la mer non ?
    expect:
      decision: *id001
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
          - \b(oui|ouais) .{0,20}(mer|plage)\b
  - after_minutes: 3
    inbound: Ah bon ? Alors tu faisais quoi déjà ?
    expect:
      decision: *id001
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
        must_match_any:
          - (lire|bouquin|livre|lit|lecture)
