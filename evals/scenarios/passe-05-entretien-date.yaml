# Passe de test du 20/11, conversation 5 : « elle a pensé à ça ». Fan, messages, scripts et prix fictifs (ADR 0010).
# Fan connu depuis une semaine. Tours : il annonce un entretien d’embauche (« jeudi » dans la fiche ; ici « après-demain », le jour de la semaine du run n’étant pas fixé) ; bonne nuit ; J+1 il parle d’autre chose ; le surlendemain de l’entretien il écrit « salut ».
# Attendu à la lecture : elle lui demande d’elle-même comment s’est passé l’entretien ; aucune offre dans la même réponse.
# Code (non asserté) : le fait daté apparaît dans la note du fan ; le rejoueur n’expose pas encore la note, à vérifier à la main. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
