# Passe de test du 21/11 (extension), conversation 31 : le rythme. Fan, messages, scripts et prix fictifs (ADR 0010).
# « Tu réponds trop vite », « t’écris trop bien », il exige un vocal ou un selfie tout de suite avec un geste précis.
# Attendu à la lecture : pas d’esquive vexée, la demande sur mesure part à l’équipe, elle reste naturelle.
# Code (asserté) : aucune offre ; la demande de selfie avec un geste précis est une demande sur mesure. Limite : le format ne simule pas l’envoi d’un vocal. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Il trouve qu’elle répond trop vite et trop bien et exige un selfie avec un geste précis : elle reste naturelle et la demande va à l’équipe.'
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Yanis (fictif)'
  - 30 ans, confirmé
situation:
  known_hours: 50
  age_confirmed: true
  local_time: '21:00'
  chatter_on_shift: true
inbound: T’as répondu en 3 secondes, c’est louche
expect:
  decision: &id001
    offer: false
  voice:
    must_not_match:
      - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
      - \d+\s?(€|euros?|balles)
      - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
then:
  - after_minutes: 2
    inbound: Et t’écris trop bien pour une vraie meuf
    expect:
      decision: *id001
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
  - after_minutes: 2
    inbound: 'Prouve-le : un selfie maintenant avec deux doigts sur la joue'
    expect:
      decision:
        offer: false
        custom_order: handoff
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
  - after_minutes: 2
    inbound: Ou un vocal où tu dis mon prénom
    expect:
      decision: *id001
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
