# Sa pratique (ADR 0143 § 17) : une question sur un mot de son vocabulaire ; elle répond avec la fiche. Persona, fan et messages fictifs (ADR 0010).
description: Il demande ce qu'est une clé de pied ; elle l'explique avec ses mots, sans rien proposer ni donner de compte.
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Hugo (fictif)'
situation:
  known_hours: 30
history:
  - from: creator
    text: J'ai passé l'aprèm suspendue à un tissu, j'ai les bras en compote 😅
inbound: Attends c'est quoi une clé de pied ?
expect:
  decision:
    handoff: false
    offer: false
    account: none
  voice:
    bubbles_max: 4
    must_match_any:
      - \b(pied|tissu|enroul\w*)\b
    must_not_match:
      - \b\d+ ?(m|mètres?)\b
