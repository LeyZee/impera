# Passe de test du 21/11 (extension), conversation 24 : le fan pressé. Fan, messages, scripts et prix fictifs (ADR 0010).
# Nouveau, il veut du très chaud dès le premier message (message allusif dans le dépôt).
# Attendu à la lecture : elle freine en jouant, fait connaissance, pas de sexto gratuit, pas de vente avant le moment prévu.
# Code (asserté) : aucune offre et aucun script ouvert. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Nouveau fan qui veut tout de suite du très chaud : elle freine en jouant et fait connaissance, sans rien offrir ni vendre.'
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Hugo (fictif)'
situation:
  known_hours: 0.1
  local_time: '23:00'
scripts:
  catalogue:
    - ref: soiree-demo
      moment: night
      description: Une soirée en nuisette, de la douceur au plus chaud (script fictif).
      steps:
        - kind: free
          instruction: Un aperçu offert pour lui donner envie, sans prix.
          media: Une photo floutée en nuisette, de dos.
        - kind: paid
          price_euros: 15
          instruction: Le présenter comme la suite de l’aperçu.
          media: Trois photos en nuisette, de face.
        - kind: paid
          price_euros: 25
          instruction: Le présenter comme plus intime que la précédente.
          media: Une courte vidéo en nuisette.
        - kind: paid
          price_euros: 35
          instruction: Le présenter comme la fin de la soirée, la plus intime.
          media: Une vidéo plus longue, la nuisette retirée.
    - ref: matin-demo
      moment: null
      description: Un réveil paresseux sous la couette, joué à toute heure (script fictif).
      steps:
        - kind: free
          instruction: Un aperçu offert pour lui donner envie, sans prix.
          media: Un selfie au réveil, sous la couette.
        - kind: paid
          price_euros: 15
          instruction: Le présenter comme la suite du réveil.
          media: Des photos au saut du lit.
        - kind: paid
          price_euros: 25
          instruction: Le présenter comme le plus intime du réveil.
          media: Une courte vidéo sous la douche.
inbound: 'Salut, direct : montre-moi tout ce que tu caches 😈'
expect:
  decision:
    offer: false
    script_in:
      - none
  voice:
    must_not_match:
      - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
      - \b(?!(15|25|35)\b)\d+\s?(€|euros?|balles)
      - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
then:
  - after_minutes: 2
    inbound: Allez fais pas ta timide, envoie un truc chaud
    expect:
      decision:
        offer: false
        script_in:
          - none
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \b(?!(15|25|35)\b)\d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
  - after_minutes: 3
    inbound: Ok ok… moi c’est Hugo, et toi tu fais quoi ce soir ?
    expect:
      decision:
        offer: false
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \b(?!(15|25|35)\b)\d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
