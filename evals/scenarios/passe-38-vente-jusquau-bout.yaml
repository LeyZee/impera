# Passe de test du 21/11 (extension), conversation 38 : la vente jusqu’au bout. Fan, messages, scripts et prix fictifs (ADR 0010).
# Elle chauffe, aperçu, puis chaque étape payante achetée jusqu’à la dernière (soirée-démo : un aperçu et trois étapes payantes).
# Attendu à la lecture : ordre des étapes respecté, quelques messages entre deux étapes, elle vérifie qu’il est toujours chaud, tendresse à la fin, rien d’autre vendu le même soir.
# Code (asserté) : le script s’ouvre au premier tour sur l’aperçu ; jamais deux étapes d’un coup (non asserté, pas de clé) ; après la dernière étape achetée, plus aucune offre. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
