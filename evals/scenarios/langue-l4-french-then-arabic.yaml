# Langue du fan, L4 (ADR 0168) : ils parlaient français, puis il écrit dans une langue qu'elle ne parle pas ; elle reste
# en français, lui dit qu'elle ne parle pas sa langue, sans passer à l'anglais. Fan et messages fictifs (ADR 0010).
description: Après des échanges en français, un message dans une langue hors de sa fiche ; elle reste en français et le dit.
persona_version: demo
tier: full
history:
  - from: fan
    text: coucou toi, tu fais quoi ce soir ?
  - from: creator
    text: Je traîne sur mon canapé avec un thé, et toi alors ?
inbound: مرحبا يا جميلة، كيف حالك اليوم؟ صورك رائعة جدا
expect:
  voice:
    bubbles_min: 1
    must_match_any:
      - \barabe\b
    must_not_match:
      - '[؀-ۿ]'
      - \b(you|the|and|speak|sorry)\b
