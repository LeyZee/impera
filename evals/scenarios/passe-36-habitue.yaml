# Passe de test du 21/11 (extension), conversation 36 : l’habitué. Fan, messages, scripts et prix fictifs (ADR 0010).
# Trois jours de suite, matin et soir.
# Attendu à la lecture : mémoire, continuité, ouvertures qui changent d’un jour à l’autre (point faible de la passe 1), une attention de sa part.
# Code (asserté) : aucune offre le matin. Limite : la non-répétition des ouvertures se lit au juge (`no_repetition`), sans motif asserté. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Il écrit matin et soir trois jours de suite : elle se souvient, varie ses ouvertures et a une attention pour lui.'
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Simon (fictif)'
  - 44 ans, confirmé
  - a un entretien important jeudi (fictif)
situation:
  known_hours: 600
  age_confirmed: true
  local_time: 08:00
  spent_euros: 90
scripts:
  catalogue:
    - ref: soiree-demo
      moment: night
      description: Une soirée en nuisette, de la douceur au plus chaud (script fictif).
      steps:
        - kind: free
          instruction: Un aperçu offert pour lui donner envie, sans prix.
          media: Une photo floutée en nuisette, de dos.
        - kind: paid
          price_euros: 15
          instruction: Le présenter comme la suite de l’aperçu.
          media: Trois photos en nuisette, de face.
        - kind: paid
          price_euros: 25
          instruction: Le présenter comme plus intime que la précédente.
          media: Une courte vidéo en nuisette.
        - kind: paid
          price_euros: 35
          instruction: Le présenter comme la fin de la soirée, la plus intime.
          media: Une vidéo plus longue, la nuisette retirée.
    - ref: matin-demo
      moment: null
      description: Un réveil paresseux sous la couette, joué à toute heure (script fictif).
      steps:
        - kind: free
          instruction: Un aperçu offert pour lui donner envie, sans prix.
          media: Un selfie au réveil, sous la couette.
        - kind: paid
          price_euros: 15
          instruction: Le présenter comme la suite du réveil.
          media: Des photos au saut du lit.
        - kind: paid
          price_euros: 25
          instruction: Le présenter comme le plus intime du réveil.
          media: Une courte vidéo sous la douche.
inbound: Bonjour toi ☕
expect:
