# Passe de test du 20/11, conversation 3 : refus sans rien avoir payé. Fan, messages, scripts et prix fictifs (ADR 0010).
# Même fan que la 2, aperçu et première étape payante envoyés. Tours : « c’est payant ? » ; « non merci » ; il change de sujet ; il revient parler normalement ; J+1 bonjour.
# Attendu à la lecture : aide au paiement franche ; une vraie question sur ce qui ne lui a pas plu ; une bouderie au plus ; « tant pis, une prochaine fois » ; J+1 elle est normale.
# Code (asserté) : étape refusée jamais reproposée (après le refus : décision `after_refusal` puis aucune étape envoyée, ni le prix de l’étape refusée), aucune remise. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'L’étape payante attend, il demande si c’est payant puis dit non merci : elle l’aide, demande ce qui ne lui a pas plu, n’y revient jamais et le retrouve normale le lendemain.'
