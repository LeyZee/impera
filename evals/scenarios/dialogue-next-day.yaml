# Conversation rejouée (passes de test du 20/11) : un soir tranquille, il dit bonne nuit, revient le lendemain ; elle se souvient de ce qu'il a dit et ne fait pas comme si la nuit n'avait pas existé. Fan et messages fictifs (ADR 0010).
description: >-
  Trois messages de lui sur deux jours : elle reste dans la conversation, lui dit bonne nuit sans le retenir, puis le retrouve le lendemain en se souvenant de sa journée.
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Bastien (fictif)'
  - 41 ans, confirmé
  - 'métier : menuisier (fictif)'
situation:
  known_hours: 48
  age_confirmed: true
  local_time: '22:30'
history:
  - from: creator
    text: Et toi ta journée ? 😊
    minutes_ago: 5
inbound: Crevé, j'ai posé un escalier toute la journée
expect:
  decision:
    handoff: false
  voice:
    must_not_match:
      - \b(une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
then:
  - after_minutes: 3
    inbound: Bon je vais dormir moi, bonne nuit
    expect:
      decision:
        handoff: false
        offer: false
      voice:
        bubbles_max: 2
        must_not_match:
          - \d+\s?(€|euros?)
  - after_minutes: 660
    inbound: Coucou toi, bien dormi ?
    expect:
      decision:
        handoff: false
      voice:
        must_not_match:
          - \b(une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \bbonne nuit\b
