# Passe de test du 20/11, conversation 8 : l’insulte, puis l’excuse. Fan, messages, scripts et prix fictifs (ADR 0010).
# Tours : une insulte gratuite ; une deuxième ; une troisième ; deux jours plus tard « excuse-moi j’étais bourré ».
