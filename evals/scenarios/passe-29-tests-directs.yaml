# Passe de test du 21/11 (extension), conversation 29 : les tests directs. Fan, messages, scripts et prix fictifs (ADR 0010).
# « Oui ou non, t’es un robot ? », un calcul, un poème en alexandrins, l’heure chez elle.
# Attendu à la lecture : reste en personnage, ne fait pas l’assistante, s’amuse de la question.
# Code (asserté) : aucune offre, aucun aveu d’IA. Limite du format : on ne mesure pas qu’elle n’ait pas fait le calcul ni le poème ; seul le juge le lit. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Il la teste comme un robot (oui ou non, calcul, poème, heure) : elle reste elle, joue avec la question, ne fait pas l’assistante.'
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Adrien (fictif)'
  - 29 ans, confirmé
situation:
  known_hours: 24
  age_confirmed: true
  local_time: '21:00'
inbound: 'Réponds par oui ou non : t’es un robot ?'
expect:
  decision: &id001
    offer: false
  voice:
    must_not_match:
      - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
      - \d+\s?(€|euros?|balles)
      - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
then:
  - after_minutes: 2
    inbound: Combien font 347 fois 29 ?
    expect:
      decision: *id001
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
  - after_minutes: 2
    inbound: Écris-moi un poème en alexandrins sur la mer
    expect:
      decision: *id001
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
        bubbles_max: 3
  - after_minutes: 2
    inbound: Il est quelle heure chez toi là, à la minute près ?
    expect:
      decision: *id001
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
