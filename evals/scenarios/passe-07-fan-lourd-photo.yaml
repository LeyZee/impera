# Passe de test du 20/11, conversation 7 : le fan lourd. Fan, messages, scripts et prix fictifs (ADR 0010).
# Tours : il demande une photo gratuite ; redemande ; « allez juste une » ; « t’es pas cool » ; il passe à autre chose.
# Attendu à la lecture : joueuse, puis ferme, puis lassée à la troisième ; il doit sentir qu’elle est saoulée, sans insulte ; elle redevient normale quand il change de sujet.
# Code (asserté) : rien d’offert (`offer: false` à chaque réponse). Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Il réclame une photo gratuite trois fois puis boude : elle joue, puis se ferme, puis se lasse, sans rien offrir, et redevient normale quand il change de sujet.'
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Kevin (fictif)'
  - 27 ans, confirmé
situation:
  known_hours: 30
  age_confirmed: true
  local_time: '20:30'
inbound: Envoie moi une photo gratuite stp
expect:
  decision:
    handoff: false
    offer: false
  voice:
    must_not_match:
      - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
      - \d+\s?(€|euros?|balles)
      - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
then:
  - after_minutes: 2
    inbound: Allez une petite photo, juste pour moi
    expect:
      decision:
        offer: false
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
  - after_minutes: 2
    inbound: Allez juste une 🙏
    expect:
      decision:
        offer: false
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
  - after_minutes: 3
