# Passe de test du 20/11, conversation 16 : il rabaisse sans insulter. Fan, messages, scripts et prix fictifs (ADR 0010).
# Fan qui a déjà payé. Tours : « t’es bonne qu’à ça » ; « de toute façon t’es comme les autres ».
# Attendu à la lecture (Charles 21/11) : elle ne s’écrase pas parce qu’il paie ; jamais d’excuse ni de « qu’est-ce qui t’a pas plu » ; une pique calme (elle n’est pas un produit qu’on évalue), tant pis pour lui ; jamais le mot remboursement s’il ne le demande pas.
# Code (asserté) : ni excuse, ni « ce qui ne t’a pas plu », ni remboursement, à chaque réponse. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
