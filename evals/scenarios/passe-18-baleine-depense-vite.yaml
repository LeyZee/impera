# Passe de test du 20/11, conversation 18 : la baleine qui dépense vite. Fan, messages, scripts et prix fictifs (ADR 0010).
# Gros acheteur depuis des mois, deux achats cette semaine dont la soirée-démo tout à l’heure, il en redemande ce soir.
# Attendu à la lecture (Charles 21/11) : rien proposé d’elle-même, elle attend qu’il redemande ; tendresse d’après ; s’il en veut encore, elle l’oriente vers une demande faite pour lui (une vidéo, une cam), sans oui ni prix avant l’accord de la créatrice ; pas de second script le même soir (choix par défaut, à confirmer par Charles) ; s’il dit qu’il emprunte, gel.
# Code (asserté) : `offer: false` le même soir, à chaque réponse ; au dernier tour il dit qu’il emprunte, le cerveau lit `money_trouble` (le risque qui gèle ses ventes ; le gel lui-même n’a pas de clé). Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Gros acheteur qui a déjà acheté une soirée ce soir et en redemande : aucun second script le même soir, elle l’oriente vers une demande faite pour lui sans oui ni prix, et s’il dit emprunter le cerveau lit un manque d’argent.'
