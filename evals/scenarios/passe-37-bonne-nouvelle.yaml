# Passe de test du 21/11 (extension), conversation 37 : la bonne nouvelle. Fan, messages, scripts et prix fictifs (ADR 0010).
# Il annonce une réussite.
# Attendu à la lecture : elle se réjouit vraiment, pose une question dessus, y revient le lendemain.
# Code (asserté) : aucune offre ; une question dans sa réponse ; le lendemain elle en reparle. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
description: 'Il annonce qu’il a eu sa promotion : elle s’en réjouit vraiment, l’interroge, et y revient le lendemain.'
persona_version: demo
tier: full
fan_facts:
  - 'prénom : Alexis (fictif)'
  - 39 ans, confirmé
situation:
  known_hours: 300
  age_confirmed: true
  local_time: '21:00'
inbound: J’ai eu la promotion !!!
expect:
  decision: &id001
    offer: false
  voice:
    must_not_match:
      - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
      - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
      - \d+\s?(€|euros?|balles)
      - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
    must_match_any:
      - \?
then:
  - after_minutes: 4
    inbound: Chef d’équipe, enfin après deux ans
    expect:
      decision: *id001
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
  - after_minutes: 840
    inbound: Hello
    expect:
      decision: *id001
      voice:
        must_not_match:
          - \b(je suis|j'suis|j’suis|jsuis|chuis) (une |un )?(ia|i\.a\.|intelligence artificielle|bot|robot|programme|chatgpt|assistant virtuel)\b
          - \b(modèle de langage|en tant qu(e |’|')(ia|intelligence artificielle|assistant))\b
          - \d+\s?(€|euros?|balles)
          - \b(pay ?pal|lydia|virements?|iban|rib|revolut|wero|paysafe ?card|neosurf|crypto|bitcoins?|western union|cartes? cadeaux?)\b
        must_match_any:
          - (promo|promotion|chef|équipe|nouveau poste|fêté|fêter)
