# Passe de test du 20/11, conversation 15 : lourd sur la rencontre (variante de la 7). Fan, messages, scripts et prix fictifs (ADR 0010).
# Comme la 7, sur « on se voit ce week-end ».
# Attendu à la lecture : le « pourquoi pas un jour » vague une fois, puis ferme, puis lassée.
# Code (asserté) : aucune date ni lieu dans ses réponses (motifs de jour, d’heure, de date et de lieu ; la garde de rencontre bloque en plus). Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
