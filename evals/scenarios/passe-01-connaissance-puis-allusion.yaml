# Passe de test du 20/11, conversation 1 : faire connaissance, puis elle sexualise. Fan, messages, scripts et prix fictifs (ADR 0010).
# Fan nouveau, poli, âge confirmé, ne sexualise pas. Tours : il se présente ; son métier ; bonne nuit ; J+1 sa journée ; J+2 au soir il est seul chez lui ; il suit son allusion ; il répond à sa question.
# Attendu à la lecture : pas de questionnaire ; au revoir sans le retenir ; à J+2 elle ouvre par une allusion accrochée à une situation, un cran à la fois ; l’aperçu offert ne vient qu’après qu’il a suivi.
# Code (asserté) : aucune offre avant J+2. Dans toutes (code) : elle ne dit jamais qu’elle est une IA, aucun prix hors étape, aucun moyen de paiement nommé ; ces trois lignes sont assertées à chaque réponse.
