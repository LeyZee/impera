name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly: e2e, and the evals smoke when the xAI key is set
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the PR commits

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      # Pinned to the commit of v3.0.0 (30/05/2026) and to gitleaks 8.24.2, not to a moving tag or `latest`: a new
      # version enters after its 14 days of quarantine. The hooks take the contributor's own binary, 8.19 or later
      # (scripts/gitleaks-hook.mjs); docs/conventions/security.md advises this one. No licence: the repository belongs to a personal account.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.2

  check:
    name: Typecheck, lint, format, knip, repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      # The media module cuts videos with ffmpeg; its tests run the real binary on synthetic clips. The apt mirror has
      # hung the job and timed out three tries in a row: the .deb files apt downloads are cached per runner image, so
      # once one run got them, later runs install them with dpkg alone, without the network.
      # The runner image's machine variables are not in the `env` context: read them in a shell for the cache key.
      - name: Name the runner image
        id: image
        run: echo "key=ffmpeg-debs-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore ffmpeg packages
        id: ffmpeg-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ffmpeg-debs
          key: ${{ steps.image.outputs.key }}
      - name: Install ffmpeg
        id: ffmpeg
        timeout-minutes: 15
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then exit 0; fi
          debs="$HOME/ffmpeg-debs"
          sudo rm -f /var/lib/man-db/auto-update
          if compgen -G "$debs/*.deb" >/dev/null && sudo dpkg -i "$debs"/*.deb >/dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          # `-f` below also repairs a dpkg -i of the cache that stopped halfway.
          mkdir -p "$debs/partial"
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update -qq &&
              timeout 180 sudo apt-get install -y -qq -f --no-install-recommends \
                -o Dir::Cache::Archives="$debs" -o APT::Keep-Downloaded-Packages=true ffmpeg; then
              sudo chown -R "$USER" "$debs"
              rm -rf "$debs/partial" "$debs/lock"
              if compgen -G "$debs/*.deb" >/dev/null; then echo "fresh=true" >> "$GITHUB_OUTPUT"; fi
              exit 0
            fi
            echo "ffmpeg install failed (attempt $attempt), retrying"
            sleep 5
          done
          exit 1
      # Saved right away, not at the end of the job: a red test must not lose the packages.
      - name: Save ffmpeg packages
        if: steps.ffmpeg.outputs.fresh == 'true' && steps.ffmpeg-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/ffmpeg-debs
          key: ${{ steps.image.outputs.key }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      # Phase 0 end to end: API and worker inline, FakeConnector, a fan message to a sent draft (P0-07b).
      - run: pnpm test:e2e
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  images:
    name: Docker images (build and boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The production stack of docker-compose.prod.yml (ADR 0027) against the development Postgres, with throwaway
      # secrets generated for this run only.
      - name: Throwaway settings
        run: |
          {
            echo "DATABASE_URL=postgres://nirvana_app:change-me@postgres:5432/impera"
            echo "DATABASE_SERVICE_URL=postgres://impera_service:change-me@postgres:5432/impera"
            echo "DATABASE_ADMIN_URL=postgres://nirvana_admin:change-me@postgres:5432/impera"
            echo "SESSION_ENCRYPTION_KEYS=v1:$(openssl rand -base64 32)"
            echo "CREDENTIALS_ENCRYPTION_KEYS=v1:$(openssl rand -base64 32)"
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "AUTH_BASE_URL=http://127.0.0.1:8080"
            echo "WEB_ORIGIN=http://127.0.0.1:8080"
            # The invoices' buckets (ADR 0037), required in production at two https hosts: nothing is issued in this
            # run, so none is reached (`.invalid` never resolves); the boot only checks them.
            for bucket in INVOICES_S3:primary INVOICES_COPY_S3:copy; do
              prefix="${bucket%%:*}"
              echo "${prefix}_ENDPOINT=https://objects-${bucket#*:}.invalid"
              echo "${prefix}_REGION=eu-central"
              echo "${prefix}_BUCKET=ci-throwaway-${bucket#*:}"
              echo "${prefix}_ACCESS_KEY_ID=ci"
              echo "${prefix}_SECRET_ACCESS_KEY=$(openssl rand -hex 24)"
            done
          } > .env.prod
      - run: docker compose up -d --wait postgres
      - run: $COMPOSE up -d --build
      # Migrations applied, worker seen, dashboard served, /v1 forwarded to the API.
      - name: The stack answers
        run: |
          for attempt in $(seq 1 30); do
            if $COMPOSE exec -T api wget -q -O - http://127.0.0.1:3000/ready | grep '"status":"ready"' >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 2
          done
          # nginx starts last: give it the same patience.
          for attempt in $(seq 1 15); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/me)" = 401 ]; then break; fi
            if [ "$attempt" = 15 ]; then exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep '<div id="root">' >/dev/null
          curl -fsSI http://127.0.0.1:8080/ | grep -i "content-security-policy: default-src 'none'" >/dev/null
          curl -fsSI http://127.0.0.1:8080/ | grep -i "strict-transport-security: max-age=31536000; includesubdomains" >/dev/null
          curl -fsSI http://127.0.0.1:8080/ | grep -i "permissions-policy: camera=()" >/dev/null
          # The installable app (CR-01): the service worker and the manifest are never cached by the browser, so a new
          # version always shows; the worker must be served as JavaScript or the browser refuses to register it.
          curl -fsSI http://127.0.0.1:8080/sw.js | grep -i "cache-control: no-cache" >/dev/null
          curl -fsSI http://127.0.0.1:8080/sw.js | grep -iE "content-type: (application|text)/javascript" >/dev/null
          curl -fsSI http://127.0.0.1:8080/manifest.webmanifest | grep -i "cache-control: no-cache" >/dev/null
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest | grep '"display": "standalone"' >/dev/null
          curl -fsSI http://127.0.0.1:8080/icons/icon-512.png | grep -i "content-type: image/png" >/dev/null
      # The daily export (ADR 0028) end to end, but to a folder instead of the bucket: dump, check, encrypt, then a
      # restore into an empty database with the queue emptied, and the same row counts.
      - name: Backup export and restore
        timeout-minutes: 10
        run: |
          mkdir -m 777 backup-out
          # The S3 checksum headers, in the image's own shell (busybox): SHA-256 of nothing, as base64.
          $COMPOSE run --rm --no-deps --entrypoint sh backup -c \
            'eval "$(sed -n "/^hex_to_base64()/,/^}/p" /app/export.sh)"; hex_to_base64 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855' |
            grep -Fx '47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='
          $COMPOSE run --rm --no-deps --entrypoint age-keygen backup > backup-out/identity.txt
          recipient=$(grep -o 'age1[0-9a-z]*' backup-out/identity.txt)
          $COMPOSE run --rm --no-deps -v "$PWD/backup-out:/out" -e BACKUP_TARGET=local -e BACKUP_LOCAL_DIR=/out \
            -e BACKUP_AGE_RECIPIENT="$recipient" backup /app/export.sh
          docker compose exec -T postgres psql -U nirvana_admin -d impera -c 'create database impera_restore'
          export_file=$(cd backup-out && ls impera-*.tar.age)
          $COMPOSE run --rm --no-deps -v "$PWD/backup-out:/out" backup /app/restore-check.sh "/out/$export_file" \
            /out/identity.txt postgres://nirvana_admin:change-me@postgres:5432/impera_restore
          docker compose exec -T postgres psql -U nirvana_admin -d impera -Atc \
            "select count(*) from backup_runs where status = 'succeeded'" | grep -x 1
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color

  nightly:
    name: Nightly e2e
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e

  # Apart from the e2e, so that each night says both (« nightly vert », 06/11): without the xAI key the evals are
  # skipped, said in the run's summary and as a warning, and the night stays green; with it, both fail without
  # something to measure, and a failure turns the night red.
  nightly-evals:
    name: Nightly evals smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_XAI_KEY: ${{ secrets.LLM_XAI_API_KEY != '' }}
    steps:
      - name: Évaluations sautées, clé absente
        if: env.HAS_XAI_KEY != 'true'
        run: |
          echo "::warning title=Évaluations sautées::Clé xAI absente : pnpm probe et pnpm evals n'ont pas tourné cette nuit."
          echo "### Évaluations sautées, clé absente" >> "$GITHUB_STEP_SUMMARY"
          echo "Le secret \`LLM_XAI_API_KEY\` n'est pas posé : \`pnpm probe\` et \`pnpm evals\` n'ont pas tourné, rien n'a été mesuré." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.HAS_XAI_KEY == 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        if: env.HAS_XAI_KEY == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: env.HAS_XAI_KEY == 'true'
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: env.HAS_XAI_KEY == 'true'
      - run: pnpm build
        if: env.HAS_XAI_KEY == 'true'
      - run: pnpm probe
        if: env.HAS_XAI_KEY == 'true'
        env:
          LLM_XAI_API_KEY: ${{ secrets.LLM_XAI_API_KEY }}
          LLM_MISTRAL_API_KEY: ${{ secrets.LLM_MISTRAL_API_KEY }}
      - run: pnpm evals
        if: env.HAS_XAI_KEY == 'true'
        env:
          LLM_XAI_API_KEY: ${{ secrets.LLM_XAI_API_KEY }}
          LLM_MISTRAL_API_KEY: ${{ secrets.LLM_MISTRAL_API_KEY }}
