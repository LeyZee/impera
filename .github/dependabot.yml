# Mises à jour automatiques des dépendances (hygiène et sécurité, security.md §5).
# Les mineures et correctifs sont groupés en une PR hebdomadaire ; les majeures arrivent séparément.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Suit la version de Node du projet (.nvmrc, 22) : une majeure de @types/node décrirait une API absente.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The base images, pinned by digest in the Dockerfiles (security.md §5): one PR when a tag moves to a new digest.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /ops/db-export
    schedule:
      interval: weekly
