# Local development environment: `docker compose up -d` then `pnpm db:migrate`.
# Integration tests do not use this file (Testcontainers starts its own Postgres).
services:
  postgres:
    image: postgres:16-alpine
    container_name: impera-postgres
    environment:
      POSTGRES_DB: impera
      POSTGRES_USER: nirvana_admin
      POSTGRES_PASSWORD: change-me
    ports:
      # This machine only: the example password is public, the base must never answer to the local network.
      - '127.0.0.1:5432:5432'
    volumes:
      - impera-pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nirvana_admin -d impera']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # Named explicitly: a database created before the rename keeps its volume through IMPERA_PGDATA_VOLUME in .env
  # (`docker volume ls` gives its name), a new install gets impera-pgdata (ADR 0062 § 3).
  impera-pgdata:
    name: ${IMPERA_PGDATA_VOLUME:-impera-pgdata}
