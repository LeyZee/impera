<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it the safe areas of an iPhone read 0 (CR-01). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nirvana</title>
    <meta name="description" content="Nirvana, l’espace de l’agence, des chatteurs et des créatrices." />
    <!-- Nuit by default; public/appearance.js and src/shell/appearance.ts switch it to Jour with the page. -->
    <meta name="theme-color" content="#060508" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nirvana" />
    <!-- Blocking on purpose: the theme must be set before the first paint. -->
    <script src="/appearance.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
