# Git hooks, installed by `pnpm install` (root `prepare` script). Never bypass them with --no-verify (CLAUDE.md).
# Requires the `gitleaks` binary on the PATH (winget install Gitleaks.Gitleaks / brew install gitleaks); without it the
# secret scans stop the commit and the push with the way to install it (scripts/gitleaks-hook.mjs).
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: node scripts/gitleaks-hook.mjs staged
    # The staged files are read by the scripts, never passed as arguments: a merge that stages thousands of them would
    # go over the command-line limit of Windows.
    format:
      run: node scripts/staged-check.mjs format
    lint:
      run: node scripts/staged-check.mjs lint
    repo:
      run: node scripts/check-repo.mjs --staged

pre-push:
  piped: true
  commands:
    protect-main:
      priority: 1
      use_stdin: true
      run: node scripts/protect-main.mjs
    gitleaks:
      priority: 2
      run: node scripts/gitleaks-hook.mjs push
    check:
      priority: 3
      run: pnpm check
    test:
      priority: 4
      run: pnpm test

commit-msg:
  commands:
    conventional:
      run: node scripts/commit-msg.mjs {1}
