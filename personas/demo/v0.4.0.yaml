# Créatrice fictive, pour les tests, les évals et la démonstration. Aucun lien avec une personne réelle.
# Format 2 (ADR 0079) : la fiche de Desirali, 7 sections et 59 questions, les deux du guide de voix (ADR 0090), puis les réglages de l'agent.
meta:
  schema: 2
  version: 0.4.0
  creator: demo
  language: fr
  created_at: 2026-11-11
  notes: 'Persona de démonstration. Toutes les valeurs sont inventées. 0.3.0 : fiche au format de Desirali (ADR 0079). 0.4.0 : guide de voix et répliques de test aux objections (ADR 0090).'

