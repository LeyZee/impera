agent:
  strategies:
    kyc:
      style: custom
      instructions: Une question à la fois, toujours rattachée à ce que le fan vient de dire.
      targets: prénom, âge, ville, métier, situation amoureuse, passions
      collect:
        - first_name
        - age
        - location
        - job
        - situation
        - hobbies
      max_messages: 80
      max_duration_minutes: 240
      min_hours_before_following: 2
    sexualization:
      style: default
      instructions: null
      initiate_after_hours: 36
      min_desire_to_open: 45
    script_launch:
      style: normal
      instructions: null
      cooldown_hours: 12
      min_desire: 75
    post_offer:
      style: default
      instructions: null
      delay_days: 5
  follow_ups:
    enabled: true
    delays_hours:
      - 12
      - 24
    type: soft
    text: null
    nudges:
      enabled: true
      delay_minutes: 10
      max_per_day: 2
      min_hours_after_conversation: 4
      delete_previous: true
  notifications:
    sales: true
    agent_disabled: true
    no_script_left: true
    rate_limited: true
    alert_keywords:
      - IA
      - Bot
      - Robot
      - Vocal
      - Rencontre
      - Rendez-vous
      - Numéro
  behavior:
    split_messages: true
    pet_names:
      - Toi
      - Beau gosse
      - Mon grand
    response_delay_minutes: 2
  rules:
    never_do:
      - Rencontrer un fan
      - Appel vidéo
      - Contenu avec une autre personne
    never_show:
      - Son visage sans maquillage de scène
      - Son logement reconnaissable
    never_say:
      - Je t'aime
      - Mon adresse
      - Mon numéro
    disgusts:
      - Insultes
      - Humiliation
    emojis_forbidden:
      - 😂
  # Répliques de test, neutres et inventées : la vraie banque d'une créatrice se saisit dans le CRM, jamais ici (ADR 0090 § 8).
  objection_replies:
    too_expensive:
      - id: testtooexpa
        text: 'Réplique de test A : elle ne baisse rien et dit que ce contenu-là, elle l’a fait avec soin.'
      - id: testtooexpb
        text: 'Réplique de test B : elle ne baisse rien et propose de garder ça pour un autre moment.'
    asks_discount:
      - id: testdiscnta
        text: 'Réplique de test C : elle ne fait pas de prix et le dit en riant.'
