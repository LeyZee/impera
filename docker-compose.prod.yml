# Production deployment (ADR 0027, docs/runbooks/deploy.md): what Coolify deploys from `main`, and a local rehearsal.
# The database is Supabase (ADR 0152): DATABASE_URL, DATABASE_SERVICE_URL and DATABASE_ADMIN_URL go through its pooler in session
# mode, never transaction mode (Graphile Worker needs LISTEN/NOTIFY), in TLS whose certificate is checked
# (sslmode=verify-full). Every variable is set in Coolify, never in a file of the repository.
#
# Local rehearsal against the development Postgres, with a .env.prod (ignored by git) copied from .env.example and the
# database host set to `postgres`, and the invoices' buckets and SENTRY_DSN as the CI job `images` writes them (https
# hosts under `.invalid`: nothing is issued, none is reached); the database first, the migrations need it up:
#   docker compose up -d --wait postgres
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RELEASE: ${SOURCE_COMMIT:-unknown}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
  # Coolify's proxy, then the web container's nginx.
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  # Connections per process (ADR 0152 § 2): their sum over api and worker stays under the pooler's pool size.
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_SERVICE_POOL_MAX: ${DATABASE_SERVICE_POOL_MAX:-5}
  RATE_LIMIT_POOL_MAX: ${RATE_LIMIT_POOL_MAX:-3}
  DATABASE_URL: ${DATABASE_URL:?}
  # The role the API and the worker cross creators with (ADR 0087): rows only, it owns nothing.
  DATABASE_SERVICE_URL: ${DATABASE_SERVICE_URL:?}
  # The owner: `migrate` and the ops scripts run by hand in this image. The API and the worker never connect with it.
  DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?}
  SESSION_ENCRYPTION_KEYS: ${SESSION_ENCRYPTION_KEYS:?}
  CREDENTIALS_ENCRYPTION_KEYS: ${CREDENTIALS_ENCRYPTION_KEYS:?}
  AUTH_SECRET: ${AUTH_SECRET:?}
  AUTH_BASE_URL: ${AUTH_BASE_URL:?}
  WEB_ORIGIN: ${WEB_ORIGIN:?}
  PLAYGROUND_PERSONA_PATH: ${PLAYGROUND_PERSONA_PATH:-}
  # Required (OPS-18): production errors reach Sentry, EU region, scrubbed by the API (operations.md § Observabilité).
  SENTRY_DSN: ${SENTRY_DSN:?}
  # Optional: the origin of the redirect service; empty, the link connector is off (ADR 0120 § 3).
  LINK_SERVICE_ORIGIN: ${LINK_SERVICE_ORIGIN:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-impera-media}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  # The invoices' PDFs under compliance lock (ADR 0037): Hetzner, then the copy at OVHcloud. Required: the API refuses
  # to start in production without both, rather than keep a PDF in memory.
  INVOICES_S3_ENDPOINT: ${INVOICES_S3_ENDPOINT:?}
  INVOICES_S3_REGION: ${INVOICES_S3_REGION:?}
  INVOICES_S3_BUCKET: ${INVOICES_S3_BUCKET:?}
  INVOICES_S3_ACCESS_KEY_ID: ${INVOICES_S3_ACCESS_KEY_ID:?}
  INVOICES_S3_SECRET_ACCESS_KEY: ${INVOICES_S3_SECRET_ACCESS_KEY:?}
  INVOICES_COPY_S3_ENDPOINT: ${INVOICES_COPY_S3_ENDPOINT:?}
  INVOICES_COPY_S3_REGION: ${INVOICES_COPY_S3_REGION:?}
  INVOICES_COPY_S3_BUCKET: ${INVOICES_COPY_S3_BUCKET:?}
  INVOICES_COPY_S3_ACCESS_KEY_ID: ${INVOICES_COPY_S3_ACCESS_KEY_ID:?}
  INVOICES_COPY_S3_SECRET_ACCESS_KEY: ${INVOICES_COPY_S3_SECRET_ACCESS_KEY:?}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  IMPERA_INLINE_WORKER: '0'

# The same image for the three Node services; Docker's cache builds it once.
x-api-image: &api-image
  build: { context: ., dockerfile: apps/api/Dockerfile }
  image: impera-api:${SOURCE_COMMIT:-local}

services:
  # Applies the pending migrations, then exits; the API and the worker start only once it succeeded.
  migrate:
    <<: *api-image
    command: ['node', 'dist/scripts/migrate.js']
    environment: *api-env
    restart: 'no'
    healthcheck: { disable: true }

  api:
    <<: *api-image
    environment: *api-env
    volumes:
      - training:/data/training
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *api-image
    command: ['node', 'dist/worker.js']
    environment:
      <<: *api-env
      # Graphile Worker runs on the service pool: one connection per job at once, one to LISTEN, and room for the
      # worker's own reads (deploy.md § 1.1, budget). WORKER_CONCURRENCY + 3 at the defaults.
      DATABASE_SERVICE_POOL_MAX: ${WORKER_DATABASE_SERVICE_POOL_MAX:-8}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # ffmpeg runs here (ADR 0070): on a 2-vCPU server it may take one CPU at most, so the API stays responsive
    # (ADR 0152 § 1).
    cpus: ${WORKER_CPUS:-1}
    # A job in progress gets 25 s to finish after SIGTERM (operations.md).
    stop_grace_period: 30s
    healthcheck: { disable: true }

  # The only public service: Coolify gives it the domain; /v1 reaches the API through it.
  web:
    # The CRM's public address, built into the extension the guide serves (ADR 0067, second amendement).
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # EXTENSION_CRM_ORIGIN set and empty: no built-in address (the CI's stack, served over http). Set to another site
      # than WEB_ORIGIN, the extension's build fails.
      # RELEASE: the commit, as the API's (OPS-18), for the release of the dashboard's error reports.
      args:
        {
          EXTENSION_CRM_ORIGIN: '${EXTENSION_CRM_ORIGIN-${WEB_ORIGIN}}',
          WEB_ORIGIN: '${WEB_ORIGIN-}',
          RELEASE: '${SOURCE_COMMIT:-unknown}',
        }
    environment:
      API_UPSTREAM: api:3000
      MEDIA_ORIGIN: ${S3_ENDPOINT:-}
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    ports:
      # Loopback only: in production every request comes through Coolify's proxy, never straight to this port.
      - '127.0.0.1:${WEB_PORT:-8080}:8080'

  # The daily encrypted export outside Supabase (ADR 0028, ops/db-export). Without its settings it still starts, and the
  # night's export fails into backup_runs, where the 26-hour alert sees it: a missing backup is never silent.
  backup:
    build: { context: ops/db-export }
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-${DATABASE_ADMIN_URL:?}}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_TARGET: s3
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck: { disable: true }

volumes:
  training:
